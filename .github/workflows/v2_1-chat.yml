name: Chat and messaging safety
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  safety:
    name: Chat safety / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:chat
      - run: pnpm test:chat-server
      - run: pnpm build
      - run: pnpm exec playwright-core install --with-deps chromium
      - run: pnpm test:chat-e2e -- "${RUNNER_TEMP}/today-chat"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chat-safety-${{ matrix.node }}
          path: ${{ runner.temp }}/today-chat/
          retention-days: 14
